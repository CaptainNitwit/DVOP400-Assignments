name: Build and Push Multi-Platform Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug source being built
        run: |
          pwd
          ls -la
          echo "---- Final Project/index.html ----"
          grep -n "<title>\|<h1>" "Final Project/index.html" || echo "Final Project/index.html not found"
          echo "---- Final Project/Dockerfile ----"
          sed -n '1,120p' "Final Project/Dockerfile"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./Final Project
          file: ./Final Project/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dvop400-final:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: dvop-finalcluster
          location: us-central1

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/dvop-app dvop-app=${{ secrets.DOCKER_USERNAME }}/dvop400-final:latest
          kubectl rollout restart deployment/dvop-app
          kubectl rollout status deployment/dvop-app